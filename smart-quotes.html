<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smart Quotes Converter</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  textarea { width: 100%; height: 220px; font-family: monospace; font-size: 14px; box-sizing: border-box; padding: 0.5rem; }
  button { padding: 0.6rem 1.2rem; font-size: 15px; margin: 0.5rem 0.5rem 0.5rem 0; cursor: pointer; }
  label { font-weight: bold; display: block; margin-top: 1rem; }
  #status { color: green; font-weight: bold; margin-left: 1rem; }
</style>
</head>
<body>
<h2>Straight → Curly Quotes</h2>
<label for="input">Paste text (straight quotes):</label>
<textarea id="input" placeholder="Paste your text here..."></textarea>

<div>
  <button onclick="convert()">Convert</button>
  <button onclick="copyOutput()">Copy Result</button>
  <span id="status"></span>
</div>

<label for="output">Result (curly quotes) — paste this into your doc:</label>
<textarea id="output" readonly></textarea>

<script>
function smartenQuotes(raw) {
  let result = '';
  for (let i = 0; i < raw.length; i++) {
    const c = raw[i];
    const prev = i > 0 ? raw[i - 1] : '';
    if (c === '"') {
      result += (prev === '' || /[\s([{\u2014-]/.test(prev)) ? '\u201C' : '\u201D';
    } else if (c === "'") {
      result += (prev === '' || /[\s([{\u2014-]/.test(prev)) ? '\u2018' : '\u2019';
    } else {
      result += c;
    }
  }
  return result;
}

function convert() {
  const input = document.getElementById('input').value;
  document.getElementById('output').value = smartenQuotes(input);
  document.getElementById('status').textContent = '';
}

function copyOutput() {
  const out = document.getElementById('output');
  out.select();
  navigator.clipboard.writeText(out.value).then(() => {
    document.getElementById('status').textContent = 'Copied!';
    setTimeout(() => document.getElementById('status').textContent = '', 1500);
  });
}
</script>
</body>
</html>
